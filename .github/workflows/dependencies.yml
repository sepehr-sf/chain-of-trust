
name: Install Python Dependencies

on:
  push:

jobs:
  install-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify setup.py integrity
        run: |
          CURRENT_HASH=$(sha256sum utils_lib/setup.py | awk '{print $1}')
          TRUSTED_HASH="c0263bc00e2170c76e5cd7599fe63d047c22262673b622256feb2749a84b7113"
          
          echo "Current hash: $CURRENT_HASH"
          echo "Trusted hash: $TRUSTED_HASH"

          if [ "$CURRENT_HASH" != "$TRUSTED_HASH" ]; then
            echo "ERROR: setup.py has been modified!"
            exit 1
          fi

          echo "Hash verified successfully."

      - name: Install dependencies
        run: pip install -r requirements.txt
