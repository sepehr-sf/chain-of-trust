
name: Install Python Dependencies

on:
  push:

jobs:
  install-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify setup.py integrity
        run: |
          CURRENT_HASH=$(sha256sum utils_lib/setup.py | awk '{print $1}')
          TRUSTED_HASH="#utils-lib==0.1.0 --hash=sha256:6e0c399aca8b0b0dd194c8ed9489ff4ac8311bc26d9372826cee22e8a45471eb"

          if [ "$CURRENT_HASH" != "$TRUSTED_HASH" ]; then
            echo "ERROR: setup.py has been modified!"
            exit 1
          fi

          echo "Hash verified successfully."

      - name: Install dependencies
        run: pip install -r requirements.txt
